<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes Personalizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="assets/stylecruds.css"> <!-- CORREGIDO: sin 's' -->
</head>
<body>
  <div id="Lanavbar"></div>
  <div class="container mt-4">
    <h2>Clientes Personalizado</h2>
    <button class="btn btn-per mb-3" data-bs-toggle="modal" data-bs-target="#modalAgregarPerso">Agregar Cliente Personalizado</button>

    <div class="table-wrapper">
      <div class="scroll-alert">Desplázate horizontalmente para ver más información</div>
      <div class="table-scroll-container">
        <table class="table table-dark table-bordered compact-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Edad</th>
              <th>Sexo</th>
              <th>Peso (kg)</th>
              <th>Altura (cm)</th>
              <th>IMC</th>
              <th>Condiciones</th>
              <th>Objetivos</th>
              <th>Ficha</th>
              <th>Plan Entreno</th>
              <th>Plan Nutrición</th>
              <th>Plan Farmacología</th>
              <th>Entrenador</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientesPerso"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal agregar cliente personalizado -->
  <div class="modal fade" id="modalAgregarPerso" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formAgregarPerso" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Cliente Personalizado</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <input type="text" id="nombrePerso" name="nombrePerso" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" id="emailPerso" name="emailPerso" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-3">
              <input type="number" id="edadPerso" name="edadPerso" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-3">
              <select id="sexoPerso" name="sexoPerso" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" id="pesoPerso" name="pesoPerso" class="form-control mb-2" placeholder="Peso (kg)" step="0.1">
            </div>
            <div class="col-md-3">
              <input type="number" id="alturaPerso" name="alturaPerso" class="form-control mb-2" placeholder="Altura (cm)" step="0.1">
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="condicionesPerso" name="condicionesPerso" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="objetivosPerso" name="objetivosPerso" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="fichaPerso" name="fichaPerso" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="planEntrenamientoPerso" name="planEntrenamientoPerso" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="planNutricionPerso" name="planNutricionPerso" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="planFarmacologiaPerso" name="planFarmacologiaPerso" class="form-control mb-2" placeholder="Plan de Farmacología" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" id="entrenadorPerso" name="entrenadorPerso" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar cliente personalizado -->
  <div class="modal fade" id="modalEditarPerso" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formEditarPerso" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente Personalizado</h5>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idPerso" id="idPerso">
          <div class="row">
            <div class="col-md-6">
              <input type="text" id="editNombrePerso" name="editNombrePerso" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" id="editEmailPerso" name="editEmailPerso" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-3">
              <input type="number" id="editEdadPerso" name="editEdadPerso" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-3">
              <select id="editSexoPerso" name="editSexoPerso" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" id="editPesoPerso" name="editPesoPerso" class="form-control mb-2" placeholder="Peso (kg)" step="0.1">
            </div>
            <div class="col-md-3">
              <input type="number" id="editAlturaPerso" name="editAlturaPerso" class="form-control mb-2" placeholder="Altura (cm)" step="0.1">
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editCondicionesPerso" name="editCondicionesPerso" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editObjetivosPerso" name="editObjetivosPerso" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editFichaPerso" name="editFichaPerso" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editPlanEntrenamientoPerso" name="editPlanEntrenamientoPerso" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editPlanNutricionPerso" name="editPlanNutricionPerso" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editPlanFarmacologiaPerso" name="editPlanFarmacologiaPerso" class="form-control mb-2" placeholder="Plan de Farmacología" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" id="editEntrenadorPerso" name="editEntrenadorPerso" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudperso.js"></script>
  <script type="module">
    import { cargarNavBar } from "./js/layout.js";
    cargarNavBar();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes Personalizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="assets/stylesemiperso.css">
</head>
<body>
  <div class="container mt-4">
    <h2>Clientes Personalizado</h2>
    <button class="btn btn-per mb-3" data-bs-toggle="modal" data-bs-target="#modalAgregarPerso">Agregar Cliente Personalizado</button>

    <table class="table table-dark table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Edad</th>
          <th>Sexo</th>
          <th>Condiciones Médicas</th>
          <th>Objetivos de Entrenamiento</th>
          <th>Ficha Antropométrica</th>
          <th>Plan de Entrenamiento</th>
          <th>Plan de Nutrición</th>
          <th>Plan de Farmacología</th>
          <th>Entrenador Asignado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientesPerso"></tbody>
    </table>
  </div>

  <!-- Modal agregar cliente personalizado -->
  <div class="modal fade" id="modalAgregarPerso" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formAgregarPerso" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Cliente Personalizado</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="nombrePerso" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="emailPerso" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="edadPerso" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="sexoPerso" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="condicionesPerso" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="objetivosPerso" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="fichaPerso" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="planEntrenamientoPerso" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="planNutricionPerso" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="planFarmacologiaPerso" class="form-control mb-2" placeholder="Plan de Farmacología" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" name="entrenadorPerso" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar cliente personalizado -->
  <div class="modal fade" id="modalEditarPerso" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formEditarPerso" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente Personalizado</h5>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idPerso">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="editNombrePerso" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="editEmailPerso" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="editEdadPerso" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="editSexoPerso" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editCondicionesPerso" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editObjetivosPerso" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editFichaPerso" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editPlanEntrenamientoPerso" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editPlanNutricionPerso" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editPlanFarmacologiaPerso" class="form-control mb-2" placeholder="Plan de Farmacología" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" name="editEntrenadorPerso" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudperso.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container mt-4">
    <h2>Gestión de usuarios</h2>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalagregar">Agregar usuario</button>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Nombre Completo</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Password</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablausuarios"></tbody>
    </table>
  </div>

  <!-- Modal agregar -->
  <div class="modal fade" id="modalagregar" tabindex="-1">
    <div class="modal-dialog">
      <form id="formagregar" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar usuario</h5>
        </div>
        <div class="modal-body">
          <input type="text" name="agregarnombre" id="agregarnombre" class="form-control mb-2" placeholder="Nombre Completo" required>
          <input type="text" name="agregaruser" id="agregaruser" class="form-control mb-2" placeholder="Usuario" required>
          <input type="email" name="agregarcorreo" id="agregarcorreo" class="form-control mb-2" placeholder="Correo" required>
          <input type="password" name="agregarpassword" id="agregarpassword" class="form-control mb-2" placeholder="Contraseña" required>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar -->
  <div class="modal fade" id="modaleditar" tabindex="-1">
    <div class="modal-dialog">
      <form id="formeditar" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar usuario</h5>
        </div>
        <div class="modal-body">
          <input type="text" name="editarnombrecompleto" id="editarnombrecompleto" class="form-control mb-2" placeholder="Nombre completo" required>
          <input type="text" name="editaruser" id="editaruser" class="form-control mb-2" placeholder="Usuario" required>
          <input type="email" name="editarcorreo" id="editarcorreo" class="form-control mb-2" placeholder="Correo" required>
          <input type="password" name="editarpassword" id="editarpassword" class="form-control mb-2" placeholder="Nueva contraseña (opcional)">
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudUsuarios-1.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes Semi Personalizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="assets/stylecruds.css">
</head>
<body>
  <div id="Lanavbar"></div>
  <div class="container mt-4">
    <h2>Clientes Semi Personalizado</h2>
    <button class="btn btn-per mb-3" data-bs-toggle="modal" data-bs-target="#modalAgregarSemi">Agregar Cliente Semi Personalizado</button>

    <div class="table-wrapper">
      <div class="scroll-alert">Desplázate horizontalmente para ver más información</div>
      <div class="table-scroll-container">
        <table class="table table-dark table-bordered compact-table semi-perso">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Edad</th>
              <th>Sexo</th>
              <th>Peso (kg)</th>
              <th>Altura (cm)</th>
              <th>IMC</th>
              <th>Condiciones</th>
              <th>Objetivos</th>
              <th>Ficha</th>
              <th>Plan Entreno</th>
              <th>Plan Nutrición</th>
              <th>Entrenador</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientesSemi"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal agregar cliente semi personalizado -->
  <div class="modal fade" id="modalAgregarSemi" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formAgregarSemi" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Cliente Semi Personalizado</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <input type="text" id="nombreSemi" name="nombreSemi" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" id="emailSemi" name="emailSemi" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-3">
              <input type="number" id="edadSemi" name="edadSemi" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-3">
              <select id="sexoSemi" name="sexoSemi" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" id="pesoSemi" name="pesoSemi" class="form-control mb-2" placeholder="Peso (kg)" step="0.1">
            </div>
            <div class="col-md-3">
              <input type="number" id="alturaSemi" name="alturaSemi" class="form-control mb-2" placeholder="Altura (cm)" step="0.1">
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="condicionesSemi" name="condicionesSemi" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="objetivosSemi" name="objetivosSemi" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="fichaSemi" name="fichaSemi" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="planEntrenamientoSemi" name="planEntrenamientoSemi" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="planNutricionSemi" name="planNutricionSemi" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" id="entrenadorSemi" name="entrenadorSemi" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar cliente semi personalizado -->
  <div class="modal fade" id="modalEditarSemi" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formEditarSemi" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente Semi Personalizado</h5>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idSemi" id="idSemi">
          <div class="row">
            <div class="col-md-6">
              <input type="text" id="editNombreSemi" name="editNombreSemi" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" id="editEmailSemi" name="editEmailSemi" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-3">
              <input type="number" id="editEdadSemi" name="editEdadSemi" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-3">
              <select id="editSexoSemi" name="editSexoSemi" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" id="editPesoSemi" name="editPesoSemi" class="form-control mb-2" placeholder="Peso (kg)" step="0.1">
            </div>
            <div class="col-md-3">
              <input type="number" id="editAlturaSemi" name="editAlturaSemi" class="form-control mb-2" placeholder="Altura (cm)" step="0.1">
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editCondicionesSemi" name="editCondicionesSemi" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editObjetivosSemi" name="editObjetivosSemi" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editFichaSemi" name="editFichaSemi" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editPlanEntrenamientoSemi" name="editPlanEntrenamientoSemi" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea id="editPlanNutricionSemi" name="editPlanNutricionSemi" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" id="editEntrenadorSemi" name="editEntrenadorSemi" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudsemi.js"></script>

  <!-- Cargar la barra de navegación -->

  <script type="module">
    import { cargarNavBar } from "./js/layout.js";
    cargarNavBar();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  
</body>
</html>

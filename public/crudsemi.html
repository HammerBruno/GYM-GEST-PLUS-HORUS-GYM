<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes Semi Personalizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="assets/stylesemiperso.css">
</head>
<body>
  <div class="container mt-4">
    <h2>Clientes Semi Personalizado</h2>
    <button class="btn btn-per mb-3" data-bs-toggle="modal" data-bs-target="#modalAgregarSemi">Agregar Cliente Semi Personalizado</button>

    <table class="table table-dark table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Edad</th>
          <th>Sexo</th>
          <th>Condiciones Médicas</th>
          <th>Objetivos de Entrenamiento</th>
          <th>Ficha Antropométrica</th>
          <th>Plan de Entrenamiento</th>
          <th>Plan de Nutrición</th>
          <th>Entrenador Asignado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientesSemi"></tbody>
    </table>
  </div>

  <!-- Modal agregar cliente semi personalizado -->
  <div class="modal fade" id="modalAgregarSemi" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formAgregarSemi" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Cliente Semi Personalizado</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="nombreSemi" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="emailSemi" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="edadSemi" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="sexoSemi" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="condicionesSemi" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="objetivosSemi" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="fichaSemi" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="planEntrenamientoSemi" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="planNutricionSemi" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" name="entrenadorSemi" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar cliente semi personalizado -->
  <div class="modal fade" id="modalEditarSemi" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formEditarSemi" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente Semi Personalizado</h5>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idSemi">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="editNombreSemi" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="editEmailSemi" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="editEdadSemi" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="editSexoSemi" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editCondicionesSemi" class="form-control mb-2" placeholder="Condiciones Médicas" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editObjetivosSemi" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editFichaSemi" class="form-control mb-2" placeholder="Ficha Antropométrica" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editPlanEntrenamientoSemi" class="form-control mb-2" placeholder="Plan de Entrenamiento" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editPlanNutricionSemi" class="form-control mb-2" placeholder="Plan de Nutrición" rows="2"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" name="editEntrenadorSemi" class="form-control mb-2" placeholder="Entrenador Asignado">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudsemi.js"></script>
</body>
</html>

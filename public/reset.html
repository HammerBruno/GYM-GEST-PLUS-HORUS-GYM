<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reset</title>
  <link rel="stylesheet" href="assets/styleforgot.css">
</head>

<body>
  <!-- Password Reset 8 - Bootstrap Brain Component -->
  <section class="bg-light p-3 p-md-4 p-xl-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-xxl-11">
          <div class="card border-light-subtle shadow-sm">
            <div class="row g-0">
              <div class="col-12 col-md-6">
                <img class="img-fluid rounded-start w-100 h-100 object-fit-cover" loading="lazy"
                  src="./assets/img/logo-img-1.webp" alt="Welcome back you've been missed!">
              </div>
              <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
                <div class="col-12 col-lg-11 col-xl-10">
                  <div class="card-body p-3 p-md-4 p-xl-5">
                    <div class="row">
                      <div class="col-12">
                        <div class="mb-5">
                          <div class="text-center mb-4">
                            <a href="#!">
                              <img src="./assets/img/bsb-logo.svg" alt="BootstrapBrain Logo" width="175" height="57">
                            </a>
                          </div>
                          <h2 class="h4 text-center">contraseña</h2>
                          <h3 class="fs-6 fw-normal text-secondary text-center m-0">recupera tu contreseña</h3>
                        </div>
                      </div>
                    </div>
                    <form id="resetform">
                      <div class="row gy-3 overflow-hidden">
                        <div class="col-12">
                          <div class="form-floating mb-3">
                            <input type="password" class="form-control" name="newpassword" id="newpassword"
                              placeholder="Nueva contraseña" required>
                            <label for="newpassword" class="form-label">Nueva contraseña</label>
                          </div>
                        </div>
                        <div class="form-floating mb-3">
                          <input type="password" class="form-control" name="confirmpassword" id="confirmpassword"
                            placeholder="Confirmar contraseña" required>
                          <label for="confirmpassword" class="form-label">Confirmar contraseña</label>
                        </div>
                        <div class="col-12">
                          <div class="d-grid">
                            <button class="btn btn-dark btn-lg" type="submit">Reset Password</button>
                          </div>
                        </div>
                      </div>
                    </form>
                    <div class="row">

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="js/reset.js"></script>
</body>

</html>

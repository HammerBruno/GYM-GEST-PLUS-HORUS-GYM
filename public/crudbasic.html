<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes Básicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="assets/stylecruds.css">
</head>
<body>
  <div id="Lanavbar"></div>
  <div class="container mt-4">
    <h2>Clientes Básicos</h2>
    <button class="btn btn-per mb-3" data-bs-toggle="modal" data-bs-target="#modalAgregarBasico">Agregar Cliente Básico</button>

    <!-- Estructura mejorada para la tabla -->
    <div class="table-wrapper">
      <div class="scroll-alert">Desplázate horizontalmente para ver más información</div>
      <div class="table-scroll-container">
        <table class="table table-dark table-bordered compact-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Edad</th>
              <th>Sexo</th>
              <th>Condiciones Médicas</th>
              <th>Objetivos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientesBasicos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal agregar cliente básico -->
  <div class="modal fade" id="modalAgregarBasico" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formAgregarBasico" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Cliente Básico</h5>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="nombreBasico" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="emailBasico" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="edadBasico" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="sexoBasico" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="condicionesBasico" class="form-control mb-2" placeholder="Condiciones Médicas" rows="3"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="objetivosBasico" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal editar cliente básico -->
  <div class="modal fade" id="modalEditarBasico" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="formEditarBasico" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Cliente Básico</h5>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idBasico">
          <div class="row">
            <div class="col-md-6">
              <input type="text" name="editNombreBasico" class="form-control mb-2" placeholder="Nombre" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="editEmailBasico" class="form-control mb-2" placeholder="Email" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="number" name="editEdadBasico" class="form-control mb-2" placeholder="Edad">
            </div>
            <div class="col-md-4">
              <select name="editSexoBasico" class="form-control mb-2" required>
                <option value="">Seleccionar sexo</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editCondicionesBasico" class="form-control mb-2" placeholder="Condiciones Médicas" rows="3"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <textarea name="editObjetivosBasico" class="form-control mb-2" placeholder="Objetivos de Entrenamiento" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/crudbasic.js"></script>
  <script type="module">
    import { cargarNavBar } from "./js/layout.js";
    cargarNavBar();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  
</body>
</html>
